# ALERTO LSTM training configuration
# Aligns with thesis §2.4 (LSTM Model Development) and §2.5 (Evaluation).

# Sequence shape
lookback_weeks: 20        # Phase 2: ~5 months of history (covers 8wk rainfall lag + trend)
horizon_weeks: 4          # 1..4 week ahead forecast (thesis §2.5)

# Feature window scaling strategy (Phase 2):
#   global           -> one StandardScaler fitted on all municipalities (default)
#   per_municipality -> one StandardScaler per municipality, with a global
#                       fallback for unseen ids. Normalises each location to its
#                       own baseline, which helps when municipalities differ a
#                       lot in case volume. Backward-compatible with serving.
scaling: global

# Features fed into the LSTM at each timestep (must exist in
# data/processed/surveillance_weekly_training.csv). Order matters: it is
# preserved in {disease}_config.json and reused at inference time.
#
# The columns are grouped as:
#   1. Surveillance signal       (case counts + rolling sums)
#   2. Seasonality               (sin/cos/month)
#   3. Meteorology               (temperature, humidity, rainfall + lags)
#   4. Environmental / WASH      (derived from per-case ReportCaseForm.jsx
#                                 "LSTM Input" fields, aggregated by municipality
#                                 and ISO-week; see backend/scripts/build-ml-datasets.mjs)
feature_columns:
  # 1. Surveillance signal
  - case_count
  - cases_lag_1               # Phase 1: short-term autocorrelation (already in CSV)
  - cases_lag_2               # Phase 1: short-term autocorrelation (already in CSV)
  - cases_rolling_4wk
  - cases_rolling_8wk
  - barangay_count_reporting  # Phase 1: spatial breadth of the outbreak (already in CSV)
  # 2. Seasonality
  - week_sin
  - week_cos
  - month
  # 3. Meteorology
  - temp_mean_c
  - temp_mean_c_lag_1         # Phase 1: 1-week thermal lag (already in CSV)
  - humidity_mean_pct
  - humidity_mean_pct_lag_1   # Phase 1: 1-week humidity lag (already in CSV)
  - rainfall_sum_mm
  - rainfall_sum_mm_lag_4
  - rainfall_sum_mm_lag_6
  - rainfall_sum_mm_lag_8     # Phase 1: extended breeding/WASH lag (already in CSV)
  # 4. Environmental / WASH (rolling 4-week rates from BHU case reports)
  - pct_stagnant_water_4wk
  - pct_recent_heavy_rain_4wk
  - pct_indoor_crowding_4wk
  - pct_unimproved_water_4wk
  - pct_open_defecation_4wk
  - pct_flood_history_4wk
  - pct_drought_history_4wk

# Phase 2: per-disease feature overrides. Each disease keeps the shared
# surveillance + seasonality backbone but uses only the climate / environmental
# drivers that the literature ties to it, dropping the noise from irrelevant
# factors. A disease NOT listed here falls back to `feature_columns` above.
#   Dengue -> rainfall (current + 4/6/8wk lags), stagnant water, heavy rain, temp/humidity
#   AWD    -> current rainfall, WASH (unimproved water, open defecation), flood/drought
#   ILI    -> temperature + humidity (with 1wk lags), indoor crowding
disease_feature_columns:
  DENGUE:
    - case_count
    - cases_lag_1
    - cases_lag_2
    - cases_rolling_4wk
    - cases_rolling_8wk
    - barangay_count_reporting
    - week_sin
    - week_cos
    - month
    - temp_mean_c
    - humidity_mean_pct
    - rainfall_sum_mm
    - rainfall_sum_mm_lag_4
    - rainfall_sum_mm_lag_6
    - rainfall_sum_mm_lag_8
    - pct_stagnant_water_4wk
    - pct_recent_heavy_rain_4wk
    - pct_flood_history_4wk
  AWD:
    - case_count
    - cases_lag_1
    - cases_lag_2
    - cases_rolling_4wk
    - cases_rolling_8wk
    - barangay_count_reporting
    - week_sin
    - week_cos
    - month
    - humidity_mean_pct
    - rainfall_sum_mm
    - rainfall_sum_mm_lag_4
    - pct_recent_heavy_rain_4wk
    - pct_unimproved_water_4wk
    - pct_open_defecation_4wk
    - pct_flood_history_4wk
    - pct_drought_history_4wk
  ILI:
    - case_count
    - cases_lag_1
    - cases_lag_2
    - cases_rolling_4wk
    - cases_rolling_8wk
    - barangay_count_reporting
    - week_sin
    - week_cos
    - month
    - temp_mean_c
    - temp_mean_c_lag_1
    - humidity_mean_pct
    - humidity_mean_pct_lag_1
    - pct_indoor_crowding_4wk

# Phase 3: per-disease training overrides discovered by ml/tune.py
# (selected on validation MASE with a strict test-MASE no-regression gate,
# per-disease deterministic seed). A disease not listed here inherits the shared
# settings below. Only ILI cleared the gate with a genuine test improvement
# (gentler outbreak weighting + stronger regularisation suits its sparse,
# bimodal signal). Dengue and AWD keep the base config because no tuned variant
# improved their test MASE.
disease_overrides:
  ILI:                      # tuner winner: "wmse2_reg"
    loss_type: weighted_mse
    nonzero_weight: 2.0
    dropout: 0.35
    weight_decay: 0.0005

# Multi-step targets (already engineered in the CSV).
target_columns:
  - cases_t_plus_1
  - cases_t_plus_2
  - cases_t_plus_3
  - cases_t_plus_4

# Target transform: log1p stabilises sparse / zero-heavy weeks (especially AWD).
# Inverse expm1 is applied at inference time.
target_transform: log1p

# Model architecture
model:
  hidden_size: 128         # Phase 1: more capacity for the wider feature set
  dropout: 0.25            # Phase 1: slightly stronger regularisation

# Optimiser / training loop
train:
  batch_size: 32
  epochs: 300              # Phase 1: more epochs (still guarded by early stopping)
  learning_rate: 0.0005    # Phase 1: lower base LR, annealed by the scheduler
  weight_decay: 0.0001     # Phase 1: L2 regularisation for the small dataset
  early_stopping_patience: 30  # Phase 1: allow time for LR drops to take effect
  grad_clip_norm: 1.0      # Phase 1: clip gradients to stabilise LSTM training
  # Phase 2: loss function for the sparse, zero-heavy count targets.
  #   mse          -> plain MSE (original behaviour)
  #   huber        -> SmoothL1 (robust to the occasional outbreak spike)
  #   weighted_mse -> MSE that up-weights weeks with cases (y>0) so the model
  #                   stops collapsing to "always predict 0"
  loss:
    type: weighted_mse
    nonzero_weight: 4.0    # weight applied to weeks that actually had cases
    huber_delta: 1.0       # beta/delta for the huber option
  # ReduceLROnPlateau: halve the LR when val loss stalls (Phase 1)
  lr_scheduler:
    enabled: true
    factor: 0.5
    patience: 8
    min_lr: 0.00001
  seed: 42

# Diseases trained by `train.py --disease all`
diseases:
  - ILI
  - DENGUE
  - AWD

# Paths (relative to repo root)
paths:
  data_csv: data/processed/surveillance_weekly_training.csv
  artifacts_dir: ml/artifacts
